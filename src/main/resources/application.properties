spring.application.name=llm-gateway
anthropic.api-key=${ANTHROPIC_API_KEY}
gateway.api-key=${GATEWAY_API_KEY}
server.port=${PORT:8080}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
gateway.rate-limit-per-minute=10
anthropic.model=claude-sonnet-5
pricing.input-per-million=2.00
pricing.output-per-million=10.00
cache.max-entries=500